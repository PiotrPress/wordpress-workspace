services:
  website:
    build: .
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - .:/var/www/vhosts/localhost/html
    restart: always
    depends_on:
      - database
  database:
    image: mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    ports:
      - 3306:3306
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: wordpress
    restart: always
    volumes:
      - database:/var/lib/mysql
volumes:
  database: